<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sultan Plaza — Заказы</title>
    <meta name="description" content="Админ-панель заказов из QR-меню Sultan Plaza Hotel" />
    <meta name="theme-color" content="#101014" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SP Заказы" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Применяем тему до загрузки React, чтобы не было «вспышки» светлого/тёмного экрана
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('spadmin.settings') || '{}');
          var t = s.theme || 'system';
          if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Для работы админ-панели включите JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
