# Firebase App Hosting — настройки Cloud Run для админ-панели.
# Сборка: App Hosting выполняет `npm ci` → `npm run build` (vite) → запускает `npm start` (server.mjs).
# Документация: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0   # 0 = бесплатно в простое; поставьте 1, чтобы убрать «холодный старт»
  maxInstances: 2
  concurrency: 100
  cpu: 1
  memoryMiB: 512
